	<!-- Hidden Background Music Player -->
    <audio id="bg-music" autoplay loop style="display: none;">
        <!-- ใส่ Path หรือ URL ของไฟล์เพลงตรงนี้ -->
        <source src="555.mp3" type="audio/mpeg">
        <source src="555.ogg" type="audio/ogg">
    </audio>

    <!-- Script ปลดล็อก Autoplay สำหรับเบราว์เซอร์ยุคใหม่ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const music = document.getElementById('bg-music');
            
            // พยายามสั่งเล่นเพลงทันที
            const playPromise = music.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(function() {
                    // หากเบราว์เซอร์บล็อกการเล่นอัตโนมัติ จะรอให้ผู้ใช้กดคลิกตรงไหนก็ได้ในหน้าเว็บ 1 ครั้งเพื่อเริ่มเล่นเพลงทันที
                    const enableAudio = function() {
                        music.play();
                        document.removeEventListener('click', enableAudio);
                        document.removeEventListener('keydown', enableAudio);
                        document.removeEventListener('touchstart', enableAudio);
                    };
                    document.addEventListener('click', enableAudio);
                    document.addEventListener('keydown', enableAudio);
                    document.addEventListener('touchstart', enableAudio);
                });
            }
        });
    </script>
